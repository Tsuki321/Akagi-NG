[package]
name = "akagi-mobile-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "akagi_mortal"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mortal-fixtures"
path = "src/bin/mortal_fixtures.rs"

[dependencies]
anyhow = "1"
jni = "0.21.1"
riichi = { package = "mortal-rules", path = "../vendor/mortal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

