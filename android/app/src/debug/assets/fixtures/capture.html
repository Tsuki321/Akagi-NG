<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Akagi capture fixture</title>
  <script>
    window.fixtureResults = {
      bootstrapBeforePageScript: typeof window.__akagiCaptureInstalled === 'string',
      received: 0, sent: 0, closed: false,
    };
    const url = new URLSearchParams(location.search).get('socket');
    if (url) {
      // Make Blob conversion deliberately slower than later text/typed-array events.
      const readBlob = Blob.prototype.arrayBuffer;
      Blob.prototype.arrayBuffer = function () {
        return new Promise((resolve, reject) => setTimeout(() => readBlob.call(this).then(resolve, reject), 60));
      };
      const socket = new WebSocket(url);
      window.fixtureSocket = socket;
      window.fixtureResults.nativeInstance = socket instanceof WebSocket;
      window.fixtureResults.nativeConstants = WebSocket.OPEN === 1 && WebSocket.CLOSED === 3;
      window.fixtureResults.nativeConstructor = socket.constructor === WebSocket;
      window.fixtureResults.nativeSendSignature = socket.send.name === 'send' && socket.send.length === 1;
      socket.binaryType = 'blob';
      socket.addEventListener('open', () => {
        window.fixtureResults.sendReturnedUndefined = socket.send('fixture:text:1') === undefined;
        socket.send(new Blob([new Uint8Array([1,2,3])]));
        const view = new Uint8Array([99,4,5,6,99]);
        socket.send(view.subarray(1,4));
        view.fill(88);
        const buffer = new Uint8Array([7,8,9]);
        socket.send(buffer.buffer);
        buffer.fill(77);
        window.fixtureResults.sent = 4;
      });
      socket.addEventListener('message', () => {
        if (++window.fixtureResults.received === 4) socket.close(1000, 'fixture complete');
      });
      socket.addEventListener('close', () => { window.fixtureResults.closed = true; });
    }
    window.addEventListener('message', event => {
      if (event.data === 'untrusted:no-bridge') window.fixtureUntrustedResult = 'no-bridge';
      if (event.data === 'untrusted:has-bridge') window.fixtureUntrustedResult = 'has-bridge';
    });
  </script>
  <style>body{background:#102c28;color:#d6ebdd;font:16px system-ui;margin:0;padding:64px 24px;}p{color:#a9c7b7}</style>
</head>
<body><h1>WebSocket capture fixture</h1><p>This page runs only in the debug test harness.</p></body>
</html>
