name: Android

on:
  push:
    branches: ['android/**']
    paths: ['android/**', 'native/**', 'scripts/mobile/**', 'scripts/android_protocol_fixtures.py', '.github/workflows/android.yml', 'models/**', 'assets/liqi.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    name: Native engine and real model parity
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Native unit and rules tests
        working-directory: native
        run: cargo test --workspace
      - name: Build reference observation executable
        working-directory: native
        run: cargo build --release -p akagi-mobile-core --bin mortal-fixtures
      - name: Install model conversion dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.4.4 onnx==1.20.1 onnxruntime==1.24.3
      - name: Export and verify actual bundled models
        run: python scripts/mobile/export_models.py --native-cli native/target/release/mortal-fixtures --validate-sanma
      - name: Install Android native toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build ARM64 and emulator libraries
        working-directory: native
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release -p akagi-mobile-core --lib
      - name: Upload native libraries and model assets
        uses: actions/upload-artifact@v4
        with:
          name: mobile-engine
          path: |
            android/app/src/main/assets/models/
            android/app/src/main/jniLibs/
          retention-days: 14
      - name: Upload model parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-parity
          path: |
            artifacts/mobile-model-parity.json
            native/fixtures/generated/
          if-no-files-found: ignore

  assemble:
    name: Android app, protocol tests and lint
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobile-engine
          path: android/app/src/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and protocol reference dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          python -m pip install numpy==2.4.4 protobuf==7.34.1 loguru==0.7.3 aiohttp==3.13.5
      - name: Package protocol schema and generate reference traces
        run: |
          mkdir -p android/app/src/main/assets/protocol android/app/src/main/assets/notices
          cp assets/liqi.json android/app/src/main/assets/protocol/liqi.json
          cp LICENSE android/app/src/main/assets/notices/APP_LICENSE.txt
          cp models/LICENSE android/app/src/main/assets/notices/MODELS_LICENSE.txt
          cp lib/LICENSE android/app/src/main/assets/notices/LIBRARIES_LICENSE.txt
          cp native/vendor/mortal/LICENSE android/app/src/main/assets/notices/MORTAL_LICENSE.txt
          python scripts/android_protocol_fixtures.py
      - name: Build app and instrumentation APKs; run protocol tests and lint
        working-directory: android
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Check native library and APK alignment
        run: python scripts/mobile/check_apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  emulator:
    name: Android 16 emulator (${{ matrix.device }})
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: a54-size
            size: 1080x2340
            density: 420
          - device: compact-phone
            size: 720x1600
            density: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: artifacts/apks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android browser, UI and local inference checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 4096
          disable-animations: true
          script: bash scripts/mobile/run_emulator_checks.sh '${{ matrix.device }}' '${{ matrix.size }}' '${{ matrix.density }}'
      - name: Upload emulator evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.device }}
          path: artifacts/emulator/
          if-no-files-found: warn
          retention-days: 30
