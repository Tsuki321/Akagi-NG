name: Android UI validation

on:
  push:
    branches: ['android/**']
    paths: ['android/**', 'scripts/android_protocol_fixtures.py', 'scripts/mobile/run_emulator_checks.sh', '.github/workflows/android-ui.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: false

# UI fixtures run independently of the native conversion job. These APKs are
# test harnesses; the Android workflow alone produces the complete application.
jobs:
  ui:
    name: UI (${{ matrix.device }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: a54-size
            size: 1080x2340
            density: 420
          - device: compact-phone
            size: 720x1600
            density: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK and protocol reference
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          python -m pip install numpy==2.4.4 protobuf==7.34.1 loguru==0.7.3 aiohttp==3.13.5
          mkdir -p android/app/src/main/assets/protocol
          cp assets/liqi.json android/app/src/main/assets/protocol/liqi.json
          python scripts/android_protocol_fixtures.py
      - name: Compile real UI and run protocol tests
        working-directory: android
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Prepare emulator APKs
        run: |
          mkdir -p artifacts/apks
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/apks/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/apks/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise fullscreen UI and browser on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 4096
          disable-animations: true
          script: bash scripts/mobile/run_emulator_checks.sh '${{ matrix.device }}' '${{ matrix.size }}' '${{ matrix.density }}' ui
      - name: Save UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.device }}
          path: |
            artifacts/emulator/
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
